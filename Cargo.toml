[package]
name = "arce-ai-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ARCE.AI in the terminal: a coding and chat assistant for OpenAI-compatible models"
license = "MIT"
publish = false

[[bin]]
name = "arce"
path = "src/main.rs"

[lib]
name = "arce"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
futures-util = "0.3.34"
globset = "0.4.21"
ignore = "0.4.34"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "query"] }
rpassword = "7"
rustyline = "19.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7"
toml = "1.2.1"
unicode-width = "0.2.3"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
